# Codex defaults merged into ~/.codex/config.toml by `agent-harness init --preset codex-config`.
# Merge semantics: keys here win over existing scalars; tables merge; nothing else is touched.
# Machine-specific keys (projects.*, notify, hooks.state, mcp_servers, marketplaces, plugins)
# are intentionally absent — MCPs and plugins come from their own catalog sections.
# Windows-only tables live in config.windows.toml (applied only on win32).
# features.memories = false: long-term memory comes from ai-memory (catalog integration),
# not Codex's native memories — the two would capture the same sessions twice.
# Values re-synced with the live setup on 2026-10-20 (effort low, standard service tier).

model = "gpt-6.1-sol"
model_reasoning_effort = "low"
personality = "pragmatic"
approval_policy = "on-request"
approvals_reviewer = "guardian_subagent"
sandbox_mode = "workspace-write"
service_tier = "default"

[features]
multi_agent = true
memories = false
js_repl = false

[sandbox_workspace_write]
network_access = true

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS = "1"

[desktop]
git-show-sidebar-pr-icons = true
keepRemoteControlAwakeWhilePluggedIn = true
show-context-window-usage = true
followUpQueueMode = "queue"
dictationDictionary = []
conversationDetailMode = "STEPS_PROSE"
avatar-overlay-pet-visible = false
external-agent-import-sync-enabled = true

[desktop.open-in-target-preferences]
global = "cursor"
