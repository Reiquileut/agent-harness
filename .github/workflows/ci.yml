name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22 = current LTS floor (the hooks, mods and status line need >= 22.18 for
        # native type stripping); Node 20 reached end of life in April 2026.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Guard — no private overlay content in this public repo
        run: node scripts/guard-no-private.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Hook and status line tests
        run: pnpm test:hooks

      - name: Smoke (dry-run, non-interactive)
        shell: bash
        run: |
          node dist/cli.js init --dry-run -y --all -a claude-code -a codex -a opencode
          node dist/cli.js scaffold --dry-run -y --all

      - name: E2E (real writes into temp HOMEs + idempotency)
        shell: bash
        run: bash scripts/ci-e2e.sh

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}-node${{ matrix.node }}
          path: artifacts/e2e/

  bootstrap-ubuntu:
    name: bootstrap · fresh ubuntu:24.04
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile && pnpm build

      # A clean container, not the runner: the runner already ships node/gh/etc.,
      # which would hide a broken install step.
      - name: bootstrap/ubuntu.sh end to end
        run: docker run --rm -v "$PWD:/src" ubuntu:24.04 bash /src/scripts/ci-bootstrap-ubuntu.sh

      - name: Upload bootstrap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-ubuntu
          path: artifacts/e2e/
